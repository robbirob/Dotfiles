# Preserve existing local keyboard settings.
set-option -s extended-keys on
set -g extended-keys-format csi-u

# Enable tmux mouse support and make wheel scrolling enter copy-mode.
# This lets TUIs such as pi be scrolled naturally from inside tmux instead of
# sending stray arrow-key/input events to the running program.
set -g mouse on

# Wheel up starts copy-mode at the cursor and scrolls up through pane history.
bind-key -T root WheelUpPane copy-mode -e

# Keep natural wheel behavior while in copy-mode, and exit copy-mode once the
# viewport returns to the bottom.
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down-and-cancel
bind-key -T copy-mode    WheelUpPane   send-keys -X -N 3 scroll-up
bind-key -T copy-mode    WheelDownPane send-keys -X -N 3 scroll-down-and-cancel
